name: Grant missed payments

# Grant captured Razorpay payments that nothing granted (2026-11-15).
#
# WHY A SCHEDULE. A pass is granted by the buyer's browser after checkout or
# by Razorpay's order.paid webhook. On 2026-11-15 a ₹197 UPI payment got
# neither, and a ₹499 one on 2026-11-01 waited three days for a hand grant.
# Only something that goes looking finds those.
#
# Every 30 minutes, so a stranded buyer waits half an hour, not days. The job
# looks back 3 days and leaves anything under 15 minutes old to the webhook.
# It grants by the webhook's own rule and is safe to repeat (one row per
# payment, enforced by the database). It emails the owner only when it
# granted something or could not.
#
# Needs two secrets beyond the usual ones: RAZORPAY_KEY_ID and
# RAZORPAY_KEY_SECRET (the same pair as Vercel's). Without them the run fails,
# which is deliberate: a check that silently does nothing is the problem this fixes.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # run on demand from the Actions tab

concurrency:
  group: billing-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # MUST match ci.yml and package.json engines (">=22"); see db-health.yml.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Grant missed payments
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        # --apply lives here and nowhere else: running it by hand stays a dry run.
        run: npm run billing:reconcile -- --apply
