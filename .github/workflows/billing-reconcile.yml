name: Grant missed payments

# The payment check (2026-11-15): grant captured Razorpay payments and paid
# Paddle transactions that nothing granted, and (2026-11-22, migration 0283)
# email the owner when a paid order had no webhook delivery.
#
# THE MAIN RUN IS ON VERCEL since 2026-11-22: /api/cron/payment-check every 30
# minutes (vercel.json crons). This job's "every 30 minutes" schedule ran
# every 6 to 8 hours (19-22 Nov), so a stranded buyer waited most of a day.
# It stays as a DAILY BACKUP (in case Vercel's scheduler or CRON_SECRET
# breaks) and for runs by hand. The two may overlap safely: a grant is one
# row per payment and the alarm one email per day, both enforced by the database.
#
# Needs two secrets beyond the usual ones: RAZORPAY_KEY_ID and
# RAZORPAY_KEY_SECRET (the same pair as Vercel's). Without them the run fails,
# which is deliberate: a check that silently does nothing is the problem this fixes.


