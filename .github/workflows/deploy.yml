# Build the site on GitHub, then hand Vercel the finished output to host.
#
# WHY (2026-10-07). Vercel bills every build by the CPU minute on any machine:
# about $0.35 a push on Enhanced, about a third of the Vercel bill. Standard
# (8 GB) cannot hold the compile step: it was killed out of memory on 10-04 and
# again on 10-06, 38 minutes in. This repo is public, so GitHub's standard
# runner (4 CPUs, 16 GB) is free, and Vercel supports deploying a prebuilt
# output (`vercel build` + `vercel deploy --prebuilt`).
#
# HOW IT RUNS (live since 2026-10-07). Every push to main builds here and goes
# live. Vercel's own Git builds are off (vercel.json `git.deploymentEnabled`),
# so nothing is built twice. To go back to Vercel building, delete vercel.json.
#
# By hand (Actions tab -> Run workflow): `staged` builds with the production
# settings and uploads WITHOUT going live (`--skip-domain`); check its URL, then
# Vercel -> Deployments -> Promote. `production` goes live directly. Staged is
# how this pipeline was proven: the GitHub-built copy was checked (pages, email
# sign-in, Razorpay checkout opening = runtime secrets reach the server) and
# promoted, then Google sign-in checked on www.pyqvault.com.
#
# Production settings, never Preview: a staged production build is the real
# thing minus the domain, so it is the better test.
#
# SECRETS (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       vercel.com -> Account Settings -> Tokens
#   VERCEL_ORG_ID      Vercel team Settings -> General -> Team ID
#   VERCEL_PROJECT_ID  the question-bank project -> Settings -> General -> Project ID
# `vercel pull` brings the project's environment variables (including the
# database service key) onto the runner, so this must never run for a fork's
# pull request. workflow_dispatch can only be started by people with write access.

name: Deploy (GitHub build)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options: [staged, production]
        default: staged

# One deploy at a time; a second waits rather than racing the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@62.4.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Compiled modules only (.next/cache/webpack), never the whole .next/cache:
      # its fetch-cache holds data the build read from the database, some of it
      # with the service key, and in a public repo a pull request's workflow can
      # read this repo's Actions caches.
      - uses: actions/cache@v4
        with:
          path: .next/cache/webpack
          key: nextwebpack-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextwebpack-${{ hashFiles('package-lock.json') }}-

      - name: Pull Vercel project settings and environment
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel will not hand out "Sensitive" settings: `vercel pull` writes the
      # placeholder [SENSITIVE] instead (11 of them, 2026-10-07). The ones the
      # build reads come from GitHub's copies; runtime-only secrets stay with
      # Vercel, which supplies them to the live functions. Stops here, naming
      # the setting, if the build needs one GitHub does not have.
      - name: Fill locked settings from GitHub secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_FUNNEL_ANALYTICS: ${{ secrets.NEXT_PUBLIC_FUNNEL_ANALYTICS }}
        run: npx tsx scripts/deploy/fill-vercel-env.ts

      # VERCEL=1 makes the build produce exactly what a Vercel-hosted build
      # does: next.config.mjs renders 4 pages at a time, and every notes page is
      # prebuilt (src/lib/notes/prerender.ts). Set explicitly rather than trusting
      # the CLI to set it.
      - name: Build
        env:
          VERCEL: "1"
          NOTES_FULL_PRERENDER: "1"
        run: npx --yes "$VERCEL_CLI" build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # The last line of defence: a placeholder that reached a page, a script or
      # a function's settings would break the live site quietly, so its
      # presence anywhere in the output cancels the deploy.
      - name: No locked-setting placeholder in the built site
        run: |
          if grep -rlF "[SENSITIVE]" .vercel/output; then
            echo "::error::[SENSITIVE] found in the built output (files above). Not deploying."
            exit 1
          fi

      # The service key must never be IN the output: the server reads it from
      # its environment at runtime. Checked by value on every deploy, so "it is
      # not baked in" is a fact of this build, not an assumption. Prints file
      # names only.
      - name: No service key in the built site
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 1; fi
          if grep -rlF -- "$SERVICE_KEY" .vercel/output; then
            echo "::error::The service key's value is in the built output (files above). Not deploying."
            exit 1
          fi

      # --archive=tgz: the output is ~24,000 files and Vercel refuses an upload of
      # more than 15,000 loose ones (2026-10-07); one archive goes up instead.
      # Not piped: GitHub's default shell does not fail a pipeline, so `| tee`
      # would report a failed deploy as a success. The URL is the CLI's stdout.
      - name: Deploy the prebuilt output
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --archive=tgz --prod ${{ inputs.target == 'staged' && '--skip-domain' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "$url"
          echo "Deployed ${{ inputs.target || 'production' }}: $url" >> "$GITHUB_STEP_SUMMARY"
