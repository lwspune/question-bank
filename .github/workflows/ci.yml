name: CI

# Runs the full local gate (typecheck → lint → notes guards → tests → build)
# on every push to main and every PR. Vercel still owns deploys; this job is
# the correctness gate that the build-only pre-push hook can't fully cover —
# in particular the live-taxonomy rename guards.
#
# The Build step is CONDITIONAL (2026-08-05) — skipped when a push changed
# nothing `next build` reads. Vercel's deploy build still runs unconditionally,
# so a data-only push is still built somewhere before it is served.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions → New
# repository secret).
#
# PRODUCTION project (build prerender + notes:lint + the prod-contract suite):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY   (service role → catches PRIVATE rows too)
#
# DEDICATED TEST project (fixture-writing `npm test` — 2026-08-06, after the
# fixture-leak incident; tests/setup.ts hard-refuses to write fixtures against
# prod, so `npm test` FAILS without these):
#   TEST_SUPABASE_URL
#   TEST_SUPABASE_ANON_KEY
#   TEST_SUPABASE_SERVICE_ROLE_KEY

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the Build gate below can diff against the push /
          # PR base. Cheap here (~35 MB, ~1.3k commits). Without it the base
          # commit is missing and needs-build fails safe to "build", silently
          # undoing the saving.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Notes integrity (DB — taxonomy + tag + chapter-name resolution)
        run: npm run notes:lint
      - name: Notes LaTeX/Markdown audit (static)
        run: npm run notes:latex
      # Fixture-writing tests run against the DEDICATED TEST project only —
      # the TEST_* env vars override the prod names inside tests/setup.ts.
      - name: Tests (fixture-writing — dedicated test project)
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test
      # Read-only assertions against LIVE prod content (guide/notes editorial ↔
      # live taxonomy). Uses the PROD secrets from the job env.
      - name: Prod-contract tests (read-only against production)
        run: npm run test:prod-contract
      # `next build` prerenders 689 pages, ~317 of which query Postgres (~25 MB
      # of egress). 78 of the last 145 pushes to main changed nothing the
      # compiler reads, so that build could not have failed. Same rule as the
      # pre-push hook — scripts/lib/needsBuild.ts, spec'd in
      # tests/needs-build.test.ts — shared so the two gates cannot drift.
      # It is an allowlist of SKIPS: anything unrecognised builds.
      - name: Detect build-relevant changes
        id: buildcheck
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if npx tsx scripts/needs-build.ts "$BASE" "${{ github.sha }}"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.buildcheck.outputs.needed == 'true'
        run: npm run build
