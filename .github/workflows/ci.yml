name: CI

# Runs the local gate's checks (typecheck → lint → docs:budget → notes:latex →
# conditional notes:lint → tests) on every push to main and every PR. Vercel
# owns deploys.
#
# The prod-contract suite is NOT here (2026-08-31): it moved to a daily
# schedule (prod-contract.yml). Its drift arrives from ingestion scripts as
# often as from pushes, so it never had to be welded to the push — and the
# prod host's memory stalls were failing pushes on it over questions that had
# nothing to do with the pushed code.
#
# There is NO build step (removed 2026-10-04). Vercel runs the same `next
# build` on the same commit, on Linux, and does not deploy a build that fails,
# so a CI build added no protection. It did add load: CI and Vercel started
# together after every push, two full prerenders against the production
# database at once, and that day two back-to-back builds took the database
# down. The pre-push hook still builds before a push.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions → New
# repository secret).
#
# PRODUCTION project (notes:lint):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY   (service role → catches PRIVATE rows too)
#
# DEDICATED TEST project (fixture-writing `npm test` — 2026-08-06, after the
# fixture-leak incident; tests/setup.ts hard-refuses to write fixtures against
# prod, so `npm test` FAILS without these):
#   TEST_SUPABASE_URL
#   TEST_SUPABASE_ANON_KEY
#   TEST_SUPABASE_SERVICE_ROLE_KEY

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the notes:lint gate below can diff against the
          # push / PR base. Cheap here (~35 MB, ~1.3k commits). Without it the
          # base commit is missing and needs-notes-lint fails safe to "run",
          # silently undoing the saving.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # In the prepush chain since 2026-09-16 (539344cb) but never here — restored to keep
      # the mirror honest (CLAUDE.md byte ceilings; ~1 s).
      - name: Docs budget (CLAUDE.md size ceilings)
        run: npm run docs:budget
      - name: Notes LaTeX/Markdown audit (static)
        run: npm run notes:latex
      # notes:lint validates the /notes editorial modules against the LIVE
      # taxonomy + tags — 91 s and growing with the bank. Only a change under
      # the roots it reads can move its verdict, so it runs only then. Same
      # rule as the pre-push hook — scripts/lib/needsNotesLint.ts, spec'd in
      # tests/needs-notes-lint.test.ts and pinned to the lint's real import
      # graph by tests/notes-lint-import-roots.test.ts. Unlike the build rule
      # this is an allowlist of RUNS; the import-graph test is what stops it
      # rotting. An unresolvable changeset runs it (fail-safe).
      - name: Detect notes-lint-relevant changes
        id: notescheck
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if npx tsx scripts/needs-notes-lint.ts "$BASE" "${{ github.sha }}"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Notes integrity (DB — taxonomy + tag + chapter-name resolution)
        if: steps.notescheck.outputs.needed == 'true'
        run: npm run notes:lint
      # Fixture-writing tests run against the DEDICATED TEST project only —
      # the TEST_* env vars override the prod names inside tests/setup.ts.
      - name: Tests (fixture-writing — dedicated test project)
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test
