name: IndexNow (Bing)

# Send new and changed pages to IndexNow: Bing, Yandex, Naver, Seznam. Bing's
# index is the one ChatGPT search reads. GOOGLE DOES NOT TAKE INDEXNOW: this job
# does nothing for Google, whatever its log says.
#
# WHEN (2026-10-28). After every successful deploy, since code changes arrive
# that way, and once a day at 04:00 UTC = 09:30 IST, for changes that never
# deploy (an ingest making questions PUBLIC moves a page's date in the
# sitemap). Hourly would add nothing: pages change on those two events, and
# Bing crawls on its own schedule, in days.
#
# WHAT IT SENDS. Only URLs new or changed since the copy of the sitemap saved
# by the last good run (`--since`/`--save`; the rule, including why the ~570
# hub entries stamped with the sitemap's generation time are skipped, is
# selectChangedUrls in src/lib/seo/indexnow.ts). Resending unchanged pages is
# what IndexNow asks sites not to do. The copy lives in the Actions cache and is
# saved only when every submission succeeded, so a failed run retries in full.
# If the cache is ever lost (7 days unused), the next run sends every URL once,
# which IndexNow allows (one batch holds 10,000).
#
# No secrets: the IndexNow key is public by design (public/README-indexnow.md).
# `--apply` lives HERE ONLY, so `npm run seo:indexnow` by hand stays a dry run.

on:
  workflow_run:
    workflows: ["Deploy (GitHub build)"]
    types: [completed]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: # run on demand from the Actions tab

# A deploy and the daily run can meet; let one finish before the other reads
# the saved copy.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # match ci.yml and package.json engines
          cache: npm

      - run: npm ci

      - name: Restore the last sitemap copy
        uses: actions/cache/restore@v4
        with:
          path: indexnow-sitemap.json
          key: indexnow-sitemap-${{ github.run_id }}
          restore-keys: indexnow-sitemap-

      - name: Send new and changed pages
        run: npm run seo:indexnow -- --since=indexnow-sitemap.json --save=indexnow-sitemap.json --apply

      - name: Save the sitemap copy for the next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: indexnow-sitemap.json
          key: indexnow-sitemap-${{ github.run_id }}
