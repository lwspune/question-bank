name: Rooms digest

# Email the owner (every superadmin) what the exam rooms need (migration 0289):
# messages hidden or reported, doubts nobody answered for 2+ hours, and each
# room's day. Nothing to report, no email. scripts/rooms/digest.ts.
#
# 13:00 UTC IS 18:30 IST, half an hour after the checkout list.
#
# One email a day from the shared 100/day Resend quota (see welcome.yml for
# the budget).
#
# --apply lives HERE and nowhere else, so `npm run rooms:digest` by hand stays
# a dry run.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: # run on demand from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # MUST match ci.yml and package.json engines (">=22").
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Email the owner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npm run rooms:digest -- --apply
